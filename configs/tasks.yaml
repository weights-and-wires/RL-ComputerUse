# Candidate task pool, held-out tasks, and seed ranges.
#
# Names are MiniWoB++ task names as registered by browsergym-miniwob; the env id
# is "browsergym/miniwob.<name>". See the decisions log in docs/PLAN.md for
# names that were checked against the installed version.

train_candidates:
  - click-button
  - click-button-sequence
  - click-checkboxes
  - click-checkboxes-soft
  - click-collapsible
  - click-collapsible-2
  - click-dialog
  - click-dialog-2
  - click-link
  - click-option
  - click-tab
  - click-tab-2
  - click-widget
  - choose-list
  - enter-date
  - enter-password
  - enter-text
  - enter-text-dynamic
  - focus-text-2
  - login-user
  - navigate-tree
  - search-engine
  - social-media
  - use-autocomplete
  - email-inbox
  # Harder tasks, added after testing on 2026-11-15. The 4B base model solved
  # most of the tasks above 80-100% of the time, which leaves GRPO nothing to
  # learn from. These give the select phase more tasks in the 10-80% band.
  - book-flight
  - choose-date
  - click-scroll-list
  - click-menu
  - click-shape
  - count-shape
  - enter-time
  - find-word
  - form-sequence-2
  - grid-coordinate
  - multi-orderings
  - read-table
  - simple-arithmetic
  - social-media-some
  - email-inbox-reply

# Run 2 adds these to the candidates (task list "candidates_run2"). They are
# tasks Track A can do: no drag, draw, or slider tasks, and no tasks that need
# exact coordinates. Tasks close to a held-out task are left out on purpose
# (email-inbox-forward*, email-inbox-nl-turk, login-user-popup, click-test*,
# enter-text-2). See docs/PLAN_RUN2.md.
train_candidates_run2_extra:
  - click-menu-2
  - click-pie
  - click-shades
  - click-color
  - click-tab-2-hard
  - copy-paste
  - copy-paste-2
  - email-inbox-important
  - email-inbox-star-reply
  - social-media-all
  - number-checkboxes
  - buy-ticket
  - phone-book
  - stock-market
  - find-greatest
  - identify-shape
  - text-transform
  - guess-number
  - multi-layouts
  - use-spinner
  - scroll-text-2
  - odd-or-even

# Run 1's training pool (results/selected_tasks.json from run 1), kept here so
# run 2 can check retention on it without run 1's results folder.
run1_pool:
  - click-collapsible-2
  - choose-date
  - click-scroll-list
  - click-menu
  - enter-time
  - find-word
  - click-widget
  - enter-date
  - social-media
  - email-inbox

# Candidates for the run-2 held-out extension. select_tasks.py --heldout-extra
# screens them with the base model and keeps the 5 nearest 50% success; the
# result (the 5 tasks below plus the chosen ones) is the "heldout_v2" list.
# The config loader refuses any overlap with the training candidates.
heldout_v2_candidates:
  - click-checkboxes-transfer
  - email-inbox-delete
  - form-sequence-3
  - read-table-2
  - focus-text
  - order-food
  - sign-agreement
  - count-sides

# Never used for selection, RFT, or GRPO. Only evaluated, to check that
# training generalizes and doesn't break other skills.
heldout_tasks:
  - click-test-2
  - enter-text-2
  - login-user-popup
  - click-checkboxes-large
  - email-inbox-forward-nl

# Seed ranges by purpose: [start, start + count). The loader refuses to run if
# any two ranges overlap, so training can never see an evaluation seed.
seeds:
  eval:     {start: 0,    count: 100}      # greedy eval uses the first eval.num_seeds
  baseline: {start: 100,  count: 100}      # sampled baseline for task selection
  rft:      {start: 200,  count: 800}      # rejection-sampling warm start
  train:    {start: 1000, count: 1000000}  # GRPO draws seeds from here
