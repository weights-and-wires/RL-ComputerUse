# The tasks run 4's success criterion names: they failed by running out of
# turns at 10 turns. Run 4 wants at least 30% on them, on average.
run4_turn_limited:
  - book-flight
  - social-media-some
  - search-engine
  - email-inbox-reply
  - number-checkboxes
  - choose-list
  - grid-coordinate
  - guess-number

# Left out of run 4's pool. The reasons are in docs/PLAN_RUN4.md.
run4_exclude:
  stock-market: "timing coin flip: the price changes every 100 ms, so the click lands 10-30 ticks after the screenshot"

# Left out of the full-suite eval (every other registered task is in it).
full_suite_exclude:
  stock-market: "timing coin flip (see run4_exclude)"
  draw-circle: "needs a curved path; left_click_drag draws a straight line"
  book-flight-nodelay: "duplicate of book-flight without the animation delay"
  choose-date-nodelay: "duplicate of choose-date without the animation delay"
  click-collapsible-nodelay: "duplicate of click-collapsible without the animation delay"
  click-collapsible-2-nodelay: "duplicate of click-collapsible-2 without the animation delay"
  click-pie-nodelay: "duplicate of click-pie without the animation delay"
  use-autocomplete-nodelay: "duplicate of use-autocomplete without the animation delay"

# Eval seeds (0-99) on which sign-agreement asks only to click Cancel. On the
# other 58 seeds it asks to scroll a disabled text area to the bottom first.
# Emulated from the task's seeded draws, and equal to the 42 seeds that run 3's
# adapter solved (results/run3/eval/run3-heldout3). A success outside this list
# is long-horizon progress. See docs/PLAN_RUN4.md.
sign_agreement_cancel_only_seeds: [0, 2, 3, 4, 5, 6, 7, 8, 9, 12, 14, 15, 18, 19, 21, 28, 29, 30, 33, 35, 37, 40, 42, 43, 44, 45, 49, 53, 57, 58, 61, 62, 67, 73, 76, 82, 85, 90, 91, 94, 98, 99]
