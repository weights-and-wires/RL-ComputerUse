  - multi-layouts

# Tasks that ran out of turns in half or more of the run-3 Track B screen
# (results/run3/eval/baseline/per_task.csv, 10 turns). The run-4 pool
# reserves slots for them.
run4_long_horizon:
  - book-flight
  - social-media-some
  - grid-coordinate
  - guess-number
  - choose-list
  - number-checkboxes
  - email-inbox-reply
  - social-media-all
  - click-collapsible-2
  - email-inbox
  - email-inbox-star-reply
  - search-engine
  - social-media
  - right-angle
  - choose-date
  - tic-tac-toe
